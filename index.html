    function filterData() {
      const term = document.getElementById('search').value.toLowerCase().trim();
      let filtered = state.data;

      if (state.currentTab === 1) filtered = filtered.filter(c => c.gender === 'male');
      if (state.currentTab === 2) filtered = filtered.filter(c => c.gender === 'female');

      if (term) {
        filtered = filtered.filter(c =>
          c.name.toLowerCase().includes(term) ||
          (c.army && c.army.toLowerCase().includes(term)) ||
          c.phone.includes(term)
        );
      }

      renderList(filtered);
    }

    function renderList(list) {
      const container = document.getElementById('list');
      let html = '';

      const males = list.filter(c => c.gender === 'male');
      const females = list.filter(c => c.gender === 'female');

      if (males.length > 0) {
        html += `<div class="flex items-center gap-4 mb-6"><div class="text-4xl">👨</div><h2 class="text-2xl font-bold text-gray-800">Male Personnel (${males.length})</h2></div>`;
        males.forEach(p => html += createCard(p));
      }

      if (females.length > 0) {
        html += `<div class="flex items-center gap-4 mb-6 mt-12"><div class="text-4xl">👩</div><h2 class="text-2xl font-bold text-gray-800">Female Personnel (${females.length})</h2></div>`;
        females.forEach(p => html += createCard(p));
      }

      container.innerHTML = html || `
        <div class="text-center py-24">
          <i class="fas fa-user-slash text-6xl text-gray-300 mb-4"></i>
          <p class="text-2xl text-gray-400">No records found</p>

    }

            <div class="flex justify-between">
              <div>
                <span class="inline-block px-4 py-1 text-xs font-bold tracking-widest bg-blue-100 text-blue-700 rounded-2xl">${c.rank}</span>
                <h3 class="text-2xl font-bold text-gray-900 mt-3">${c.name}</h3>
                <p class="text-gray-500 font-mono mt-1">Army No: ${c.army}</p>
              </div>
              <div class="${c.gender === 'female' ? 'bg-pink-100 text-pink-600' : 'bg-blue-100 text-blue-600'} w-11 h-11 flex items-center justify-center rounded-2xl text-2xl shadow-inner">
                ${c.gender === 'female' ? '♀' : '♂'}
              </div>
            </div>

            <div class="mt-8 grid grid-cols-2 gap-4">

                <i class="fab fa-whatsapp"></i> WhatsApp
              </a>
            </div>
          </div>
        </div>`;
    }

    function changeTab(tab) {
      state.currentTab = tab;
      document.querySelectorAll('#tab0, #tab1, #tab2').forEach((el, i) => {

      });
      filterData();
    }
