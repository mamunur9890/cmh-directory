    :root {

      --card-male-bg: rgba(30, 41, 59, 0.7);
      --card-male-border: rgba(56, 189, 248, 0.2);
      --card-female-bg: rgba(30, 41, 59, 0.7);

      --accent-male: #0ea5e9;
      --accent-female: #f43f5e;
      
      --glass-bg: rgba(15, 23, 42, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      
      --neon-glow-male: 0 0 15px rgba(14, 165, 233, 0.15);
      --neon-glow-female: 0 0 15px rgba(244, 63, 94, 0.15);
      --shadow-3d: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);

    body { 
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      background: var(--bg-gradient); 
      color: #f8fafc;
      min-height: 100vh;
      padding-bottom: 40px;
      overflow-x: hidden;
      perspective: 1000px; /* Activates 3D workspace */

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);

      text-align: center; 
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(56, 189, 248, 0.2);
    }

    .header-btns {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 15px;
      display: flex;
      gap: 10px;
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      border: 1px solid var(--glass-border);
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .header-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .update-btn-3d {
      border-color: rgba(76, 175, 80, 0.4);
      color: #4caf50;
    }

    /* --- Interactive App Controls CONTAINER --- */
    .app-controls {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* --- Glassmorphic Search --- */
    .search-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    .search-box { 
      width: 100%; 
      padding: 16px 25px; 
      border-radius: 16px; 
      border: 1px solid var(--glass-border); 
      background: rgba(30, 41, 59, 0.5);
      color: #fff;
      font-size: 16px; 
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }
    .search-box:focus {
      border-color: var(--accent-male);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 15px rgba(14, 165, 233, 0.3);
      background: rgba(30, 41, 59, 0.8);
    }

    /* --- Neomorphic Layered Tabs --- */
    .tab-container {
      background: rgba(15, 23, 42, 0.4);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
    }
    .tab-buttons { display: flex; gap: 6px; }
    .tab-buttons button { 
      flex: 1; 
      padding: 12px 10px; 
      border: none; 
      border-radius: 10px; 
      color: #94a3b8; 
      font-size: 14px; 
      font-weight: 700; 
      cursor: pointer;
      background: transparent;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-buttons button.active { 
      color: #fff;
      background: #1e293b;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
      transform: translateY(-1px);
    }
    .tab-buttons button.active.btn-all { border-bottom: 2px solid #64748b; }
    .tab-buttons button.active.btn-male { border-bottom: 2px solid var(--accent-male); color: #38bdf8; }
    .tab-buttons button.active.btn-female { border-bottom: 2px solid var(--accent-female); color: #fb7185; }

    /* --- Dynamic Main Content List --- */
    #list {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .section-title { 
      padding: 10px 5px; 
      margin: 30px 0 10px; 
      font-weight: 800; 
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.05);
    }

    /* --- Advanced 3D Contact Cards --- */
    .contact-card { 
      background: var(--card-male-bg); 
      margin-bottom: 16px; 
      padding: 22px; 
      border-radius: 20px; 
      border: 1px solid var(--card-male-border);
      box-shadow: var(--shadow-3d);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease;
      transform-style: preserve-3d;
      position: relative;
    }
    .contact-card:hover {
      transform: translateY(-5px) rotateX(2deg) rotateY(1deg);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), var(--neon-glow-male);

    .card-female { 
      background: var(--card-female-bg);
      border-color: var(--card-female-border);
    }
    .card-female:hover {
      border-color: rgba(244, 63, 94, 0.5);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), var(--neon-glow-female);

    .card-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      transform: translateZ(20px); /* Pushes elements outward dynamically in depth */

    .rank-tag {
      font-size: 11px;
      font-weight: 800;
      background: rgba(255,255,255,0.06);
      padding: 3px 8px;
      border-radius: 6px;
      color: #cbd5e1;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.05);

    .name {

      margin-bottom: 10px;

      display: flex;
      align-items: center;
      gap: 6px;

      gap: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

    .call-btn {

      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .call-btn:hover { 
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);

    .wa-btn {

    .wa-btn:hover {

      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);

      position: fixed;
      z-index: 300;
      left: 0; top: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: fadeIn 0.3s ease-out;
    }
    .modal-content {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-3d);
      margin: 15vh auto;
      padding: 30px;
      border-radius: 24px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      transform: scale(0.9) translateY(20px);
      animation: modalSlide 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .modal-content h3 {

      margin-bottom: 5px;

    }
    .modal-dev-name {

    }
    .modal-links-box {
      margin: 25px 0 15px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px;
    }
    .modal-link {
      text-decoration: none; 
      color: white; 
      padding: 14px; 
      border-radius: 14px; 
      font-weight: 700; 
      font-size: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);

    .close-btn { 
      background: rgba(255,255,255,0.05); 
      color: #94a3b8;

      padding: 12px; 
      width: 100%;

      cursor: pointer;
      transition: all 0.2s ease;
    }
    .close-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    /* --- Animations --- */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalSlide { to { transform: scale(1) translateY(0); opacity: 1; } }
  </style>
</head>

              <span class="rank-tag">${c.rank}</span>
              <span style="font-size: 11px; font-weight:700; color: ${c.gender === 'female' ? 'var(--accent-female)' : 'var(--accent-male)'}; opacity:0.8;">
                #${c.army || 'N/A'}
              </span>
            </div>
            <div class="name">${c.name}</div>
            <div class="info"><strong>Mobile:</strong> ${c.phone}</div>
            ${c.remarks.trim() ? `<div class="remarks">${c.remarks}</div>` : ''}
            <div class="btn-group">
              <button class="call-btn" onclick="window.location.href='tel:${c.phone}'">⚡ Call</button>
              <button class="wa-btn" onclick="window.open('https://wa.me/88${c.phone.replace(/[^0-9]/g,'')}')">💬 Secure WA</button>
            </div>
          </div>`;
      }
    };

    function changeTab(i) {
      state.currentTab = i;
      document.querySelectorAll('.tab-buttons button').forEach((b, idx) => b.classList.toggle('active', idx === i));
      app.filter();
    }

    function toggleAbout(show) { 
      const modal = document.getElementById('aboutModal');
      modal.style.display = show ? 'block' : 'none'; 
    }

    // Initialize System App Engine Lifecycle
    app.render(state.data);
  </script>
</body>
</html>
