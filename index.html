<style>
  :root{
    --navy-950:#08192e;
    --navy-900:#0a2540;
    --navy-800:#12335c;
    --navy-700:#1a4373;
    --steel:#2e6ea6;
    --gold:#c99a3d;
    --gold-soft:#e8b64a;
    --rose:#b8305a;
    --rose-soft:#d85f88;
    --ok:#1f7a4d;
    --wa:#1fae5c;
    --warn:#b8790c;
    --bg:#f2f4f7;
    --surface:#ffffff;
    --surface-2:#f7f8fa;
    --border:#e2e6ec;
    --text-1:#111826;
    --text-2:#4b5566;
    --text-3:#8992a3;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(10,37,64,.06), 0 1px 1px rgba(10,37,64,.04);
    --shadow-md:0 6px 20px rgba(10,37,64,.10);
    --shadow-lg:0 20px 45px rgba(10,37,64,.20);
    --focus-ring:0 0 0 3px rgba(46,110,166,.45);
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --bg:#0b1220;
    --surface:#121b2c;
    --surface-2:#0f1729;
    --border:#233047;
    --text-1:#eef1f6;
    --text-2:#aab4c4;
    --text-3:#6d7891;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 8px 24px rgba(0,0,0,.45);
    --shadow-lg:0 24px 50px rgba(0,0,0,.55);
    color-scheme: dark;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text-1);
    min-height:100dvh;

  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }
  button{ font-family:inherit; }
  :focus-visible{ outline:none; box-shadow:var(--focus-ring); border-radius:6px; }

  /* ---------- Header ---------- */
  header{
    background:

      linear-gradient(150deg, var(--navy-950), var(--navy-800) 65%, var(--navy-700));
    color:#f4f7fb;
    padding:22px 16px 20px;
    position:relative;
    box-shadow:0 6px 22px rgba(8,25,46,.35);
  }
  .header-inner{
    max-width:720px; margin:0 auto;
    display:flex; align-items:center; gap:12px;
  }
  .crest{
    flex:0 0 auto; width:44px; height:44px; border-radius:12px;
    background:linear-gradient(160deg, var(--gold-soft), var(--gold));
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 4px 10px rgba(0,0,0,.25);
  }
  .crest svg{ width:24px; height:24px; }
  .title-block{ flex:1; min-width:0; }
  .eyebrow{
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--gold-soft); font-weight:700; opacity:.9;
  }
  h1{
    font-size:17px; font-weight:800; letter-spacing:.01em; line-height:1.25;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .header-actions{ display:flex; gap:6px; flex:0 0 auto; }
  .icon-btn{
    width:38px; height:38px; border-radius:10px; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08); color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:.15s ease; backdrop-filter: blur(4px);
  }
  .icon-btn:hover{ background:rgba(255,255,255,.16); transform:translateY(-1px); }
  .icon-btn svg{ width:18px; height:18px; }

  .stat-row{
    max-width:720px; margin:16px auto 0; display:flex; gap:10px;
  }
  .stat-pill{
    flex:1; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
    border-radius:12px; padding:8px 12px; text-align:center;
  }
  .stat-pill b{ display:block; font-size:16px; font-weight:800; }
  .stat-pill span{ font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:rgba(244,247,251,.65); }

  /* ---------- Sticky controls ---------- */
  .controls{
    position:sticky; top:0; z-index:60;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px) saturate(1.1);
    border-bottom:1px solid var(--border);
    padding:12px 16px;
  }
  .controls-inner{ max-width:720px; margin:0 auto; }

  .search-wrap{ position:relative; margin-bottom:10px; }
  .search-wrap svg.search-icon{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; color:var(--text-3); pointer-events:none;
  }
  .search-box{
    width:100%; padding:12px 40px 12px 40px; border-radius:12px;
    border:1.5px solid var(--border); background:var(--surface); color:var(--text-1);
    font-size:15px; outline:none; transition:.15s ease;
  }
  .search-box::placeholder{ color:var(--text-3); }
  .search-box:focus{ border-color:var(--steel); box-shadow:var(--focus-ring); }
  .clear-btn{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:50%; border:none; background:var(--surface-2);
    color:var(--text-2); cursor:pointer; display:none; align-items:center; justify-content:center;
  }
  .clear-btn.show{ display:flex; }

  .row-controls{ display:flex; gap:8px; align-items:center; }
  .tab-buttons{ display:flex; gap:6px; flex:1; background:var(--surface-2); padding:4px; border-radius:12px; border:1px solid var(--border); }
  .tab-buttons button{
    flex:1; padding:9px 6px; border:none; border-radius:9px; background:transparent;
    color:var(--text-2); font-size:13px; font-weight:700; cursor:pointer; transition:.15s ease;
  }
  .tab-buttons button.active{ background:var(--navy-900); color:#fff; box-shadow:var(--shadow-sm); }
  :root[data-theme="dark"] .tab-buttons button.active{ background:var(--steel); }

  .sort-select{
    border:1px solid var(--border); background:var(--surface); color:var(--text-2);
    border-radius:10px; padding:9px 10px; font-size:12.5px; font-weight:600; cursor:pointer;
  }

  /* ---------- List ---------- */
  main{ max-width:720px; margin:0 auto; padding:14px 16px 60px; }

  .section-title{
    display:flex; align-items:center; gap:8px;

    letter-spacing:.08em; text-transform:uppercase; color:var(--text-2);

  .section-title::after{ content:""; flex:1; height:1px; background:var(--border); }
  .section-title.male{ color:var(--steel); }
  .section-title.female{ color:var(--rose); }

  .contact-card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:14px 14px 12px;
    margin-bottom:10px; box-shadow:var(--shadow-sm);
    display:flex; gap:12px; align-items:flex-start;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .contact-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }

  .avatar{
    flex:0 0 auto; width:44px; height:44px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; color:#fff;
    background:linear-gradient(155deg, var(--steel), var(--navy-800));

  .card-body{ flex:1; min-width:0; }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .name-line{ min-width:0; }
  .rank-badge{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700;
    letter-spacing:.04em; color:var(--gold); background:rgba(201,154,61,.12);
    border:1px solid rgba(201,154,61,.35); padding:1px 6px; border-radius:5px; margin-bottom:4px;

  mark{ background:rgba(201,154,61,.35); color:inherit; border-radius:3px; padding:0 1px; }

  .copy-btn{
    flex:0 0 auto; width:30px; height:30px; border-radius:8px; border:1px solid var(--border);

    display:flex; align-items:center; justify-content:center; transition:.15s ease;

  .copy-btn:hover{ background:var(--border); }
  .copy-btn.copied{ background:var(--ok); border-color:var(--ok); color:#fff; }

  .badge-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .remarks{
    font-size:10.5px; background:rgba(31,122,77,.10); color:var(--ok);
    border:1px solid rgba(31,122,77,.25); padding:2px 8px; border-radius:6px; font-weight:700;
    letter-spacing:.02em;
  }
  .verify-flag{
    font-size:10.5px; background:rgba(184,121,12,.10); color:var(--warn);
    border:1px solid rgba(184,121,12,.28); padding:2px 8px; border-radius:6px; font-weight:700;
  }

  .btn-group{ display:flex; gap:8px; margin-top:12px; }
  .btn-group button{
    flex:1; padding:10px; border:none; border-radius:9px; font-weight:700; font-size:13px;
    color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
    transition:.15s ease;
  }
  .btn-group button svg{ width:15px; height:15px; }
  .call-btn{ background:var(--ok); }
  .call-btn:hover{ filter:brightness(1.08); }
  .wa-btn{ background:var(--wa); }
  .wa-btn:hover{ filter:brightness(1.08); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-3); }
  .empty-state svg{ width:46px; height:46px; margin-bottom:12px; opacity:.5; }
  .empty-state p{ font-size:14px; font-weight:600; }
  .empty-state span{ font-size:12.5px; }

  .skeleton{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:10px; display:flex; gap:12px; }
  .sk-box{ border-radius:8px; background:linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; }

  footer{ text-align:center; padding:18px 16px 34px; color:var(--text-3); font-size:11.5px; }

  /* ---------- Modal ---------- */
  #aboutModal{
    display:none; position:fixed; inset:0; z-index:200;

    align-items:center; justify-content:center; padding:20px;

  #aboutModal.open{ display:flex; }
  .modal-content{
    background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:340px;
    padding:26px 22px 20px; text-align:center; box-shadow:var(--shadow-lg);
    border:1px solid var(--border);
    animation: pop .18s ease;
  }
  @keyframes pop{ from{ opacity:0; transform:scale(.94); } to{ opacity:1; transform:scale(1);} }
  .modal-crest{
    width:52px; height:52px; border-radius:14px; margin:0 auto 14px;
    background:linear-gradient(160deg, var(--gold-soft), var(--gold));
    display:flex; align-items:center; justify-content:center;
  }
  .modal-content h3{ font-size:15px; font-weight:800; margin-bottom:4px; }
  .modal-content .role{ font-size:12px; color:var(--text-3); margin-bottom:14px; }
  .modal-content .dev-name{ font-size:14px; font-weight:700; margin-bottom:2px; }
  .modal-content .dev-unit{ font-size:12.5px; color:var(--text-2); margin-bottom:16px; line-height:1.5; }
  .modal-actions{ display:flex; flex-direction:column; gap:9px; }

  .modal-call{ background:var(--ok); }

</style>
</head>

  const RANK_ORDER = ["SWO","WO","SGT","CPL","LCPL","SNK","SNK PMA"];

  const state = { tab:"all", query:"", sort:"default" };

  const el = {
    list: document.getElementById("list"),
    search: document.getElementById("search"),
    clearSearch: document.getElementById("clearSearch"),
    sortSelect: document.getElementById("sortSelect"),
    tabs: document.querySelectorAll('[role="tab"]'),
    statRow: document.getElementById("statRow"),
  };

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[m]));
  }

  function highlight(text, term){
    if(!term) return escapeHtml(text);
    const idx = text.toLowerCase().indexOf(term.toLowerCase());
    if(idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0, idx)) +
      "<mark>" + escapeHtml(text.slice(idx, idx + term.length)) + "</mark>" +
      escapeHtml(text.slice(idx + term.length));
  }

  function initials(name){
    const parts = name.trim().split(/\s+/).filter(Boolean);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  function waLink(phone){
    const digits = phone.replace(/[^0-9]/g, "");
    const withCountry = digits.startsWith("880") ? digits : "88" + digits;
    return "https://wa.me/" + withCountry;
  }

  function getFiltered(){
    const term = state.query.trim().toLowerCase();
    let rows = DATA.slice();
    if(state.tab !== "all") rows = rows.filter(r => r.gender === state.tab);
    if(term){
      rows = rows.filter(r =>
        r.name.toLowerCase().includes(term) ||
        r.army.toLowerCase().includes(term) ||
        r.phone.includes(term) ||
        r.rank.toLowerCase().includes(term)
      );
    }
    if(state.sort === "name"){
      rows.sort((a,b) => a.name.localeCompare(b.name));
    } else if(state.sort === "rank"){
      rows.sort((a,b) => {
        const ra = RANK_ORDER.indexOf(a.rank), rb = RANK_ORDER.indexOf(b.rank);
        return (ra === -1 ? 99 : ra) - (rb === -1 ? 99 : rb) || a.name.localeCompare(b.name);
      });
    }
    return rows;
  }

  function cardHtml(c){
    const term = state.query.trim();
    const needsVerify = c.phone.replace(/[^0-9]/g,"").length !== 11;
    return `
      <div class="contact-card ${c.gender}" data-army="${escapeHtml(c.army)}">
        <div class="avatar" aria-hidden="true">${escapeHtml(initials(c.name))}</div>
        <div class="card-body">
          <div class="card-top">
            <div class="name-line">
              <span class="rank-badge">${escapeHtml(c.rank)}</span>
              <div class="name">${highlight(c.name, term)}</div>
            </div>
            <button class="copy-btn" data-phone="${escapeHtml(c.phone)}" aria-label="Copy phone number for ${escapeHtml(c.name)}" title="Copy number">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>
            </button>
          </div>
          <div class="info-row">
            <span>Army No: <b class="mono">${highlight(c.army, term)}</b></span>
            <span>Mobile: <b class="mono">${highlight(c.phone, term)}</b></span>
          </div>
          <div class="badge-row">
            ${c.remarks.trim() ? `<span class="remarks">${escapeHtml(c.remarks)}</span>` : ""}
            ${needsVerify ? `<span class="verify-flag">⚠ Verify number</span>` : ""}
          </div>
          <div class="btn-group">
            <button class="call-btn" data-action="call" data-phone="${escapeHtml(c.phone)}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .6 2.9a2 2 0 01-.5 2.1L8 10a16 16 0 006 6l1.3-1.2a2 2 0 012.1-.5c.9.3 1.9.5 2.9.6a2 2 0 011.7 2z"/></svg>
              Call
            </button>
            <button class="wa-btn" data-action="wa" data-phone="${escapeHtml(c.phone)}">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-1-.3-.1-.5-.1-.7.1s-.8 1-.9 1.2c-.2.2-.3.2-.6.1s-1.3-.5-2.4-1.5c-.9-.8-1.5-1.8-1.6-2.1-.2-.3 0-.5.1-.6l.4-.5c.1-.1.2-.3.3-.4.1-.2 0-.3 0-.5s-.7-1.7-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1.1 2.8 1.2 3c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.2.1-1.4-.1-.1-.3-.2-.5-.3z"/><path d="M12 2a10 10 0 00-8.5 15.2L2 22l4.9-1.5A10 10 0 1012 2zm0 18.2a8.1 8.1 0 01-4.2-1.1l-.3-.2-3 .9.9-2.9-.2-.3A8.2 8.2 0 1112 20.2z"/></svg>
              WhatsApp
            </button>
          </div>
        </div>
      </div>`;
  }

  function render(){
    const rows = getFiltered();
    if(rows.length === 0){
      el.list.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <p>No matching personnel</p>
          <span>Try a different name, rank, or army number.</span>
        </div>`;
      return;
    }

    if(state.sort !== "default"){
      el.list.innerHTML = rows.map(cardHtml).join("");
    } else {
      const male = rows.filter(r => r.gender === "male");
      const female = rows.filter(r => r.gender === "female");
      let html = "";
      if(male.length){
        html += `<div class="section-title male">Male Personnel · ${male.length}</div>` + male.map(cardHtml).join("");
      }
      if(female.length){
        html += `<div class="section-title female">Female Personnel · ${female.length}</div>` + female.map(cardHtml).join("");
      }
      el.list.innerHTML = html;
    }
  }

  function updateStats(){
    const male = DATA.filter(r => r.gender === "male").length;
    const female = DATA.filter(r => r.gender === "female").length;
    el.statRow.innerHTML = `
      <div class="stat-pill"><b>${DATA.length}</b><span>Total</span></div>
      <div class="stat-pill"><b>${male}</b><span>Male</span></div>
      <div class="stat-pill"><b>${female}</b><span>Female</span></div>`;
  }

  /* ---------- Events (delegated, no inline handlers) ---------- */
  let debounceId;
  el.search.addEventListener("input", () => {
    el.clearSearch.classList.toggle("show", !!el.search.value);
    clearTimeout(debounceId);
    debounceId = setTimeout(() => {
      state.query = el.search.value;
      render();
    }, 150);
  });

  el.clearSearch.addEventListener("click", () => {
    el.search.value = "";
    state.query = "";
    el.clearSearch.classList.remove("show");
    render();
    el.search.focus();
  });

  el.tabs.forEach(btn => {
    btn.addEventListener("click", () => {
      el.tabs.forEach(b => { b.classList.remove("active"); b.setAttribute("aria-selected","false"); });
      btn.classList.add("active"); btn.setAttribute("aria-selected","true");
      state.tab = btn.dataset.tab;
      render();
    });
  });

  el.sortSelect.addEventListener("change", () => {
    state.sort = el.sortSelect.value;
    render();
  });

  el.list.addEventListener("click", (e) => {
    const copyBtn = e.target.closest(".copy-btn");
    if(copyBtn){
      const phone = copyBtn.dataset.phone;
      navigator.clipboard?.writeText(phone).then(() => {
        copyBtn.classList.add("copied");
        copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>`;
        setTimeout(() => {
          copyBtn.classList.remove("copied");
          copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>`;
        }, 1400);
      });
      return;
    }
    const actionBtn = e.target.closest("[data-action]");
    if(actionBtn){
      const phone = actionBtn.dataset.phone;
      if(actionBtn.dataset.action === "call"){
        window.location.href = "tel:" + phone;
      } else {
        window.open(waLink(phone), "_blank", "noopener");
      }
    }
  });

  /* ---------- Refresh (simulated skeleton, honest about no live backend) ---------- */
  document.getElementById("refreshBtn").addEventListener("click", () => {
    el.list.innerHTML = Array.from({length:4}).map(() => `
      <div class="skeleton">
        <div class="sk-box" style="width:44px;height:44px;"></div>
        <div style="flex:1;">
          <div class="sk-box" style="width:60%;height:14px;margin-bottom:8px;"></div>
          <div class="sk-box" style="width:40%;height:11px;"></div>
        </div>
      </div>`).join("");
    setTimeout(render, 450);
  });

  /* ---------- About modal ---------- */
  const modal = document.getElementById("aboutModal");
  const aboutBtn = document.getElementById("aboutBtn");
  let lastFocused = null;

  function openModal(){
    lastFocused = document.activeElement;
    modal.classList.add("open");
    document.getElementById("closeAbout").focus();
    document.addEventListener("keydown", onModalKeydown);
  }
  function closeModal(){
    modal.classList.remove("open");
    document.removeEventListener("keydown", onModalKeydown);
    if(lastFocused) lastFocused.focus();
  }
  function onModalKeydown(e){
    if(e.key === "Escape") closeModal();
  }
  aboutBtn.addEventListener("click", openModal);
  document.getElementById("closeAbout").addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if(e.target === modal) closeModal(); });

  /* ---------- Theme ---------- */
  const themeToggle = document.getElementById("themeToggle");
  const root = document.documentElement;
  function applyTheme(t){
    root.setAttribute("data-theme", t);
  }
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(prefersDark ? "dark" : "light");
  themeToggle.addEventListener("click", () => {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
  });

  /* ---------- Init ---------- */
  updateStats();
  render();
})();
</script>
